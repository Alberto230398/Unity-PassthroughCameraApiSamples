<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WebRTC Receiver</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    overflow: hidden;
    width: 100vw; height: 100vh;
  }

  video {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    display: block;
    background: #000;
  }

  #overlay {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: #2a2a2a; font-size: 0.85rem; letter-spacing: 0.25em;
    font-family: 'Courier New', monospace; text-transform: uppercase;
    pointer-events: none;
    background: #000;
  }

  /* controlli flottanti, visibili solo sull'hover */
  #controls {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; gap: 10px; align-items: center; justify-content: center;
    padding: 14px 20px;
    background: linear-gradient(transparent, rgba(0,0,0,0.85));
    opacity: 0;
    transition: opacity 0.25s;
    font-family: 'Courier New', monospace;
  }
  body:hover #controls { opacity: 1; }

  input {
    background: rgba(20,20,20,0.9); border: 1px solid #333; color: #ccc;
    padding: 5px 9px; font-family: inherit; font-size: 0.75rem;
    width: 230px;
  }
  input.short { width: 130px; }

  button {
    background: none; border: 1px solid #555; color: #999;
    padding: 5px 14px; font-family: inherit; font-size: 0.75rem;
    cursor: pointer; letter-spacing: 0.08em; text-transform: uppercase;
    transition: border-color 0.2s, color 0.2s;
  }
  button:hover { border-color: #aaa; color: #fff; }
  button:disabled { opacity: 0.3; cursor: default; }

  #status {
    font-size: 0.7rem; color: #555; letter-spacing: 0.05em; min-width: 80px;
  }
</style>
</head>
<body>

<video id="video" autoplay playsinline muted></video>
<div id="overlay">NO SIGNAL</div>

<div id="controls">
  <input id="wsUrl" value="ws://10.10.10.147:8765" />
  <!-- <input id="wsUrl" value="ws://192.168.1.4:8765" /> -->
  <input id="questId" class="short" value="Quest-PeerId" />
  <button id="btnConnect" onclick="connect()">Connect</button>
  <button id="btnDisconnect" onclick="disconnect()" disabled>Disconnect</button>
  <span id="status">disconnected</span>
</div>

<script>
const PEER_ID = 'Browser-PeerId';
const RETRY_MS = 10000;
let ws, pc;
let pendingCandidates = [];
let remoteDescSet = false;
let manualDisconnect = false;
let retryTimer = null;

function setStatus(s) { document.getElementById('status').textContent = s; }
function setOverlay(text, white) {
  const el = document.getElementById('overlay');
  el.textContent = text;
  el.style.color = white ? '#fff' : '';
  el.style.display = 'flex';
}
function showOverlay() { setOverlay('NO SIGNAL'); }
function hideOverlay()  { document.getElementById('overlay').style.display = 'none'; }

function scheduleRetry() {
  if (retryTimer) return;   // già in attesa, non accavallare retry
  setOverlay('WAITING FOR SERVER', true);
  setStatus('waiting for server');
  document.getElementById('btnConnect').disabled    = false;
  document.getElementById('btnDisconnect').disabled = true;
  retryTimer = setTimeout(() => { retryTimer = null; connect(); }, RETRY_MS);
}

function connect() {
  if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
  manualDisconnect = false;

  const url     = document.getElementById('wsUrl').value.trim();
  const questId = document.getElementById('questId').value.trim();

  ws = new WebSocket(url);

  ws.onopen = () => {
    setStatus('ws connected');
    setOverlay('WAITING FOR VIDEO STREAM', true);
    ws.send(`CONNECT|${PEER_ID}|ALL|${PEER_ID} joined|0|False`);
    document.getElementById('btnConnect').disabled    = true;
    document.getElementById('btnDisconnect').disabled = false;
  };

  ws.onmessage = async (e) => {
    const parts   = e.data.split('|');
    const type    = parts[0];
    const sender  = parts[1];
    const payload = parts[3];

    console.log(`[WS] ${type} from ${sender}`);

    switch (type) {
      case 'NEWPEER': {
        if (sender === questId) {
          // Quest si è (ri)registrato: chiudi sempre la pc vecchia prima di crearne una nuova.
          // Senza questo, dopo che il Quest esce e rientra dall'app la pc precedente
          // rimane aperta e createPeerConnection() la riutilizzava (if pc return),
          // causando negoziazione su una connessione già morta → lag.
          closePeerConnection();
          await createPeerConnection(sender);
          ws.send(`NEWPEERACK|${PEER_ID}|${sender}|ack|0|False`);
          // NIENTE offerta dal browser: fa SOLO da answerer. Il Quest crea la sua offerta da
          // solo (OnNegotiationNeeded sul data channel + VideoManager che aggancia il video).
          // Se offrissero entrambi in contemporanea → glare: SetLocalDescription sul Quest
          // fallisce e il pacchetto lancia "LocalDescription is not exist", che pianta la
          // coroutine WebRTC.Update() → app bloccata. Un solo offerente = niente gara.
        } else {
          console.warn(`[WS] NEWPEER da "${sender}" ignorato: non combacia con questId "${questId}"`);
        }
        break;
      }
      case 'NEWPEERACK': {
        if (sender === questId && !pc) {
          // Anche qui il browser fa solo da answerer: crea la pc e aspetta l'OFFER del Quest.
          await createPeerConnection(sender);
        } else if (sender !== questId) {
          console.warn(`[WS] NEWPEERACK da "${sender}" ignorato: non combacia con questId "${questId}"`);
        }
        break;
      }
      case 'OFFER':
        await handleOffer(sender, payload);
        break;
      case 'ANSWER':
        await pc.setRemoteDescription(JSON.parse(payload));
        remoteDescSet = true;
        for (const c of pendingCandidates) {
          try { await pc.addIceCandidate(new RTCIceCandidate(c)); } catch (_) {}
        }
        pendingCandidates = [];
        break;
      case 'CANDIDATE': {
        try {
          const c = JSON.parse(payload);
          if (remoteDescSet) {
            await pc.addIceCandidate(new RTCIceCandidate(c));
          } else {
            pendingCandidates.push(c);
          }
        } catch (_) {}
        break;
      }
      case 'PEERLEFT': {
        // Il server invia PEERLEFT quando un peer perde il WebSocket senza DISPOSE
        // (es. Quest va in background). Chiudiamo la pc così quando il Quest rientra
        // e manda NEWPEER partiamo da zero invece di riutilizzare una pc morta.
        if (sender === questId) {
          closePeerConnection();
          // Il WS col server è ancora vivo: non è "NO SIGNAL", è solo il Quest che manca.
          setOverlay('WAITING FOR VIDEO STREAM', true);
        }
        break;
      }
    }
  };

  ws.onclose = () => {
    setStatus('disconnected');
    // Se il WS cade la negoziazione è persa; alla prossima connessione serve una pc fresca.
    closePeerConnection();
    document.getElementById('btnConnect').disabled    = false;
    document.getElementById('btnDisconnect').disabled = true;

    if (manualDisconnect) {
      showOverlay();
    } else {
      // Server non raggiungibile (o caduto): ritenta da solo, niente click manuale.
      scheduleRetry();
    }
  };
  ws.onerror = () => setStatus('ws error');
}

function closePeerConnection() {
  if (pc) { pc.close(); pc = null; }
  pendingCandidates = [];
  remoteDescSet = false;
  document.getElementById('video').srcObject = null;
}

async function createPeerConnection(remotePeerId) {
  if (pc) return;
  pendingCandidates = [];
  remoteDescSet = false;

  pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });

  pc.onicecandidate = e => {
    if (e.candidate)
      ws.send(`CANDIDATE|${PEER_ID}|${remotePeerId}|${JSON.stringify(e.candidate)}|0|False`);
  };

  pc.oniceconnectionstatechange = () => {
    console.log(`[ICE] ${remotePeerId}: ${pc.iceConnectionState}`);
    setStatus(pc.iceConnectionState);
    // Mostra subito "NO SIGNAL" appena ICE fallisce/si disconnette, senza aspettare PEERLEFT.
    // Questo copre il caso in cui il Quest va in background ma il WS rimane aperto (TCP keepalive).
    if (pc.iceConnectionState === 'failed' || pc.iceConnectionState === 'disconnected') {
      document.getElementById('video').srcObject = null;
      // Il WS col server è ancora vivo: non è "NO SIGNAL", è solo il Quest che manca.
      setOverlay('WAITING FOR VIDEO STREAM', true);
    }
  };

  pc.ontrack = e => {
    console.log(`[TRACK] ricevuto ${e.track.kind} da ${remotePeerId}`);
    if (e.track.kind === 'video') {
      document.getElementById('video').srcObject = e.streams[0] || new MediaStream([e.track]);
      hideOverlay();
    }
  };
}

async function handleOffer(remotePeerId, payload) {
  if (!pc) await createPeerConnection(remotePeerId);
  await pc.setRemoteDescription(JSON.parse(payload));
  remoteDescSet = true;
  for (const c of pendingCandidates) {
    try { await pc.addIceCandidate(new RTCIceCandidate(c)); } catch (_) {}
  }
  pendingCandidates = [];
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  ws.send(`ANSWER|${PEER_ID}|${remotePeerId}|${JSON.stringify(answer)}|0|False`);
}

function disconnect() {
  manualDisconnect = true;
  if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
  closePeerConnection();
  ws?.close(); ws = null;
  showOverlay();
  document.getElementById('btnConnect').disabled    = false;
  document.getElementById('btnDisconnect').disabled = true;
  setStatus('disconnected');
}

// Avvia da solo al caricamento della pagina: niente click su Connect necessario.
window.addEventListener('DOMContentLoaded', connect);
</script>
</body>
</html>
